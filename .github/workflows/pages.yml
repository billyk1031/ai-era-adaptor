name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check website code
        run: npm run lint
      - name: Test IndexNow notifications
        run: npm run test:indexnow
      - name: Build static website
        run: npm run build
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Restore last IndexNow submission
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/last-submitted.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Notify IndexNow after successful deployment
        run: npm run indexnow
      - name: Save successful IndexNow submission
        uses: actions/cache/save@v4
        with:
          path: .indexnow/last-submitted.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
